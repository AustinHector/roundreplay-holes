name: Hole maps spike

on:
  workflow_dispatch:
    inputs:
      regions:
        description: "Geofabrik region ids, comma separated (empty means all)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - name: Install osmium-tool
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool
          osmium --version
      - name: Free disk before the build
        run: |
          df -h /
          df -h /mnt
      - name: Build hole maps
        env:
          REGIONS: ${{ inputs.regions }}
        run: |
          python3 build.py \
            --work "${{ runner.temp }}/work" \
            --output _site \
            --report report.json \
            ${REGIONS:+--regions "$REGIONS"}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report
          path: report.json
          if-no-files-found: ignore

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
